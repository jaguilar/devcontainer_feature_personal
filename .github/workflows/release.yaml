name: "Release dev container features & Generate Documentation"

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Automated Documentation
        id: push_image_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Start documentation sync."

          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Stage generated documentation
          git add */**/README.md
          if git diff --staged --quiet; then
              echo "No documentation changes detected."
              exit 0
          fi

          message='Automated documentation update [skip ci]'
          git commit -m "$message"

          # 1. Try pushing directly to master first
          echo "Attempting direct push to master..."
          if git push origin HEAD:master 2>/dev/null; then
              echo "Successfully pushed documentation directly to master."
              exit 0
          fi

          # 2. Fall back to branch + Pull Request (e.g. if master has branch protection)
          echo "Direct push to master not available. Creating documentation branch and PR..."
          branch=automated-documentation-update-$GITHUB_RUN_ID
          git checkout -b "$branch"
          git push --force origin "$branch"
          gh pr create --title "Automated documentation update" --body "Automated documentation update" || echo "PR already exists or could not be created."

