name: "CI - Test Features"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        features:
          - personal
          - ai-clis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Prepare runner host environment"
        run: |
          mkdir -p "$HOME/.gemini" "$HOME/.pi/agent"
          echo '{"model": "test"}' > "$HOME/.pi/agent/settings.json"

      - name: "Run scenario tests for '${{ matrix.features }}'"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-autogenerated:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      matrix:
        features:
          - personal
          - ai-clis
        baseImage:
          - mcr.microsoft.com/devcontainers/base:debian
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Prepare runner host environment"
        run: |
          mkdir -p "$HOME/.gemini" "$HOME/.pi/agent"
          echo '{"model": "test"}' > "$HOME/.pi/agent/settings.json"

      - name: "Run autogenerated tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .
